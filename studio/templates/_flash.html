{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flashes">
      {% for category, message in messages %}
        <div class="alert alert--{{ category }}" role="alert">
          <span>{{ message }}</span>
          <button type="button" class="alert__close" aria-label="Закрыть">&times;</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
